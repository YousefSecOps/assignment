<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>People Data</h1>

        <input type="text" id="search" placeholder="Search...">

        <div class="buttons">
            <button id="nameSort" type="button">Sort by Name</button>
            <button id="ageSort" type="button">Sort by Age</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>City</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <p id="noResults"></p>
        <a href="validation.html">Back to Registration Form</a>
    </div>

    <script src="js/data.js"></script>
</body>
</html>
